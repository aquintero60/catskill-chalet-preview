      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)

      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)

      privateContent: null,

      /** @param {string} name @param {(value: unknown) =&gt; void} callback */

      ...globalThis.openai,

      sendFollowUpMessage,

      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {

        ),

    &quot;message&quot;,

      const source = apply(getMessageSource, event, []);

        hostPort != null ||

        typeof data !== &quot;object&quot; ||

      }

      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }

      }

      element = event.target;

&lt;section class=&quot;highlights&quot;&gt;&lt;p class=&quot;eyebrow&quot;&gt;THE CHALET EXPERIENCE&lt;/p&gt;&lt;h2&gt;Room to gather. Space to unwind.&lt;/h2&gt;&lt;div class=&quot;highlights-grid&quot;&gt;&lt;article&gt;&lt;i data-lucide=&quot;house&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;h3&gt;Stay your way&lt;/h3&gt;&lt;p&gt;One side for a smaller group. Both sides for your time together.&lt;/p&gt;&lt;/article&gt;&lt;article&gt;&lt;i data-lucide=&quot;coffee&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;h3&gt;Make room for slow mornings&lt;/h3&gt;&lt;p&gt;Shared meals, long conversations, and a little time without a schedule.&lt;/p&gt;&lt;/article&gt;&lt;article&gt;&lt;i data-lucide=&quot;mountain&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;h3&gt;A Catskills escape&lt;/h3&gt;&lt;p&gt;Make Tannersville your starting point for exploring the mountains.&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;dates&quot; id=&quot;cp-dates&quot;&gt;&lt;div&gt;&lt;h2&gt;Choose your dates&lt;/h2&gt;&lt;div class=&quot;month&quot;&gt;&lt;button id=&quot;cp-prev&quot; aria-label=&quot;Previous month&quot;&gt;←&lt;/button&gt;&lt;strong id=&quot;cp-month&quot;&gt;&lt;/strong&gt;&lt;button id=&quot;cp-next&quot; aria-label=&quot;Next month&quot;&gt;→&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;week&quot;&gt;&lt;span&gt;S&lt;/span&gt;&lt;span&gt;M&lt;/span&gt;&lt;span&gt;T&lt;/span&gt;&lt;span&gt;W&lt;/span&gt;&lt;span&gt;T&lt;/span&gt;&lt;span&gt;F&lt;/span&gt;&lt;span&gt;S&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;days&quot; id=&quot;cp-days&quot;&gt;&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;Dates are for your inquiry only. Availability has not been checked.&lt;/p&gt;&lt;/div&gt;&lt;aside&gt;&lt;p class=&quot;eyebrow&quot;&gt;YOUR MOUNTAIN GETAWAY&lt;/p&gt;&lt;h2&gt;Your inquiry&lt;/h2&gt;&lt;strong id=&quot;cp-summary-stay&quot;&gt;Full House&lt;/strong&gt;&lt;p id=&quot;cp-selection&quot; aria-live=&quot;polite&quot;&gt;Select check-in, then check-out.&lt;/p&gt;&lt;button class=&quot;green&quot; id=&quot;cp-continue&quot;&gt;Continue inquiry →&lt;/button&gt;&lt;p class=&quot;small&quot; id=&quot;cp-notice&quot;&gt;This is an inquiry, not a confirmed reservation. AvantStay handles final availability, booking, and payment.&lt;/p&gt;&lt;/aside&gt;&lt;/section&gt;
&lt;section class=&quot;host&quot;&gt;&lt;div&gt;&lt;p class=&quot;eyebrow&quot;&gt;A NOTE FROM THE CHALET&lt;/p&gt;&lt;h2&gt;Bring your people.&lt;br&gt;&lt;em&gt;We’ll leave room for the memories.&lt;/em&gt;&lt;/h2&gt;&lt;/div&gt;&lt;div&gt;&lt;p&gt;From the first shared coffee to the last conversation of the evening, a getaway is about having time for one another.&lt;/p&gt;&lt;p&gt;The whole chalet or a side of your own: choose the space that fits your trip.&lt;/p&gt;&lt;span class=&quot;signature&quot;&gt;— The Catskill Chalet&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;guide&quot;&gt;&lt;p class=&quot;eyebrow&quot;&gt;BEYOND THE CHALET&lt;/p&gt;&lt;h2&gt;A little inspiration for your stay.&lt;/h2&gt;&lt;div class=&quot;guide-grid&quot;&gt;&lt;details&gt;&lt;summary&gt;Winter in the Catskills ↗&lt;/summary&gt;&lt;p&gt;Explore Hunter Mountain and plan your winter days. Seasonal details and recommendations will be confirmed before publication.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Around Tannersville ↗&lt;/summary&gt;&lt;p&gt;A local guide to cafés, dining, and places to explore will live here.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Trails &amp; quieter days ↗&lt;/summary&gt;&lt;p&gt;Ideas for outdoor adventures and slower days in the mountains.&lt;/p&gt;&lt;/details&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;faq&quot;&gt;&lt;h2&gt;A few things to know&lt;/h2&gt;&lt;details&gt;&lt;summary&gt;Can I request one side separately?&lt;/summary&gt;&lt;p&gt;Yes. Choose Full House, Right Side, or Left Side. The final room and amenity details for each side will be confirmed.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Does selecting dates reserve my stay?&lt;/summary&gt;&lt;p&gt;No. An inquiry does not confirm availability or a reservation. AvantStay handles final booking and payment.&lt;/p&gt;&lt;/details&gt;&lt;/section&gt;&lt;/main&gt;&lt;footer&gt;&lt;div class=&quot;brand&quot;&gt;The Catskill Chalet&lt;small&gt;TANNERSVILLE · NEW YORK&lt;/small&gt;&lt;/div&gt;&lt;p&gt;Your people. Your pace. Your Catskills escape.&lt;/p&gt;&lt;small&gt;Design preview · no inquiries are sent&lt;/small&gt;&lt;/footer&gt;
